# `docker compose up` runs the whole loop offline against fixtures (no API keys needed).
# `docker compose run --rm orchestrator map` / `reduce --event-json /events/pr.json` /
# `report` / `metrics` / `register` use the credentials from .env (copy .env.example).
services:
  orchestrator:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      TARGET_REPO: ${TARGET_REPO:-jhomer192/superset}
      AUTOMATION_REPO: ${AUTOMATION_REPO:-jhomer192/superset-devin-automation}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERIFY_BRANCH: ${VERIFY_BRANCH:-master}
      VERIFY_EVERY_N_MERGES: ${VERIFY_EVERY_N_MERGES:-1}
      PLAYBOOK_ID_FIX: ${PLAYBOOK_ID_FIX:-}
      PLAYBOOK_ID_VERIFY: ${PLAYBOOK_ID_VERIFY:-}
      REPORT_DIGEST_ISSUE: ${REPORT_DIGEST_ISSUE:-}
      REPORT_DIGEST_EVERY_HOURS: ${REPORT_DIGEST_EVERY_HOURS:-24}
      ACU_USD: ${ACU_USD:-}
    volumes:
      - ./events:/events:ro
    command: ["simulate"]
