# `docker compose up` runs the whole loop offline against fixtures (no API keys needed).
# `docker compose run --rm orchestrator autopr` / `testing --wait --event-json /events/pr.json` /
# `testing` / `autopr` / `register` / `register-playbooks` use the credentials from .env
# (copy .env.example).
services:
  orchestrator:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      TARGET_REPO: ${TARGET_REPO:-jhomer192/superset}
      AUTOMATION_REPO: ${AUTOMATION_REPO:-jhomer192/superset-devin-automation}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      VERIFY_BRANCH: ${VERIFY_BRANCH:-master}
      VERIFY_EVERY_N_MERGES: ${VERIFY_EVERY_N_MERGES:-5}
      PLAYBOOK_ID_FIX: ${PLAYBOOK_ID_FIX:-}
      PLAYBOOK_ID_VERIFY: ${PLAYBOOK_ID_VERIFY:-}
    volumes:
      - ./events:/events:ro
    command: ["simulate"]
